<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4.5 -7 24 24" width="288" height="288">
  <defs>
    <style>
      .breathe { transform-origin: 7.5px 13px; animation: breathe 3.2s infinite ease-in-out; }
      .blink { transform-origin: 7.5px 9px; animation: blink 4s infinite ease-in-out; }
      #eyes-js, #body-js, #shadow-js { transition: transform 0.2s ease-out; }
      #shadow-js { transform-origin: 7.5px 15px; }
      @keyframes breathe { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.02, 0.98) translate(0, 0.5px); } }
      @keyframes blink { 0%, 10%, 100% { transform: scaleY(1); } 5% { transform: scaleY(0.1); } }
    </style>
  </defs>
  <g id="shadow-js"><rect x="3" y="15" width="9" height="1" fill="#D9D2CB"/></g>
  <g id="legs" fill="#D77757"><rect x="3" y="11" width="1" height="4"/><rect x="5" y="11" width="1" height="4"/><rect x="9" y="11" width="1" height="4"/><rect x="11" y="11" width="1" height="4"/></g>
  <g id="body-js">
    <g class="breathe" fill="#D77757">
      <rect x="2" y="6" width="11" height="7"/><rect x="0" y="9" width="2" height="2"/><rect x="13" y="9" width="2" height="2"/>
      <g id="eyes-js" fill="#1a1a1a"><g class="blink"><rect x="4" y="8" width="1" height="2"/><rect x="10" y="8" width="1" height="2"/></g></g>
    </g>
  </g>
</svg>
