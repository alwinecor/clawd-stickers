name: Check generated files

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # Windows, like the machine the committed files are built on.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements.txt
      - run: python dev-life/check.py
